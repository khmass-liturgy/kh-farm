<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강희농장 산란계 관리 프로그램</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
:root{
  --bg:#f5f3ee;--surface:#fff;--surface2:#faf9f6;
  --border:#ddd8cc;--border-light:#ece9e1;
  --accent:#4a7c59;--accent-light:#e8f0eb;
  --text:#1e1e1e;--text-mid:#4a4a4a;--text-soft:#8a8a8a;
  --danger:#b94040;--danger-light:#fdf0f0;
  --shadow:0 2px 8px rgba(0,0,0,.07);
  --shadow-lg:0 6px 20px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── Header ── */
header{background:var(--accent);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.header-left{display:flex;align-items:center;gap:10px;}
.header-icon{font-size:20px;}
header h1{font-size:16px;font-weight:700;}
header h1 span{font-size:11px;opacity:.7;font-weight:300;margin-left:6px;}
.header-btns{display:flex;gap:6px;}
.hbtn{border:none;border-radius:7px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all .15s;}
.hbtn-print{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);}
.hbtn-print:hover{background:rgba(255,255,255,.28);}
.hbtn-pdf{background:#c4813a;color:#fff;}
.hbtn-pdf:hover{background:#b0722f;}
.hbtn-load{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);}
.hbtn-load:hover{background:rgba(255,255,255,.28);}
.hbtn-save{background:#fff;color:var(--accent);}
.hbtn-save:hover{background:#eafaf0;}

/* ── Container ── */
.container{max-width:1200px;margin:0 auto;padding:24px 18px;}

/* ── Farm info ── */
.farm-info-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:14px;box-shadow:var(--shadow);}
.farm-info-item{flex:1;min-width:108px;}
.farm-info-item label{font-size:10px;font-weight:700;color:var(--text-soft);letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:3px;}
.farm-info-item input{width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit;color:var(--text);background:var(--surface2);}
.farm-info-item input:focus{outline:none;border-color:var(--accent);}

/* ── Tab bar ── */
.tab-bar-wrap{display:flex;align-items:flex-start;gap:6px;margin-bottom:16px;flex-wrap:wrap;}

/* 탭 버튼 그룹 */
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;}

/* 개별 탭 래퍼 - 버튼 + × 버튼 묶음 */
.tab-item{position:relative;display:flex;align-items:center;}
.tab-btn{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-mid);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.tab-btn:hover{border-color:var(--accent);color:var(--accent);}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.tab-badge{background:var(--accent-light);color:var(--accent);border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700;}
.tab-btn.active .tab-badge{background:rgba(255,255,255,.25);color:#fff;}

/* 탭 이름 편집 */
.tab-name-text{cursor:pointer;}
.tab-name-text:hover{text-decoration:underline dotted;}
.tab-btn.active .tab-name-text:hover{text-decoration:underline dotted rgba(255,255,255,.7);}

/* 탭 삭제 버튼 (× 는 active일 때만 보임) */
.tab-del-btn{display:none;position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:2px solid #fff;font-size:10px;font-weight:700;cursor:pointer;align-items:center;justify-content:center;line-height:1;z-index:10;}
.tab-item:hover .tab-del-btn{display:flex;}

/* + 탭 추가 버튼 */
.btn-add-tab{padding:8px 12px;border:1px dashed var(--accent);border-radius:8px;background:var(--surface);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.btn-add-tab:hover{background:var(--accent-light);}

/* ── Section panels ── */
.section-panel{display:none;}
.section-panel.active{display:block;}

/* ── Section card ── */
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow);}
.section-card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border-light);border-radius:12px 12px 0 0;user-select:none;}
.section-card.collapsed .section-card-header{border-radius:12px;border-bottom:none;}
.section-title-left{display:flex;align-items:center;gap:8px;flex:1;}
.section-number{width:24px;height:24px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.section-name-wrap{display:flex;align-items:center;gap:6px;flex:1;}
.section-name{font-size:14px;font-weight:700;cursor:pointer;padding:2px 4px;border-radius:4px;}
.section-name:hover{background:rgba(74,124,89,.1);}
.section-name-input{font-size:14px;font-weight:700;border:1.5px solid var(--accent);border-radius:5px;padding:2px 6px;font-family:inherit;color:var(--text);background:#fff;display:none;min-width:160px;}
.section-count{font-size:11px;color:var(--text-soft);}
.section-header-btns{display:flex;align-items:center;gap:4px;}
.btn-section-del{background:none;border:none;color:#ccc;font-size:13px;cursor:pointer;padding:3px 6px;border-radius:4px;transition:all .15s;}
.btn-section-del:hover{color:var(--danger);background:var(--danger-light);}
.collapse-icon{font-size:11px;color:var(--text-soft);transition:transform .2s;cursor:pointer;padding:3px 6px;}
.section-card.collapsed .collapse-icon{transform:rotate(-90deg);}
.section-card-body{}
.section-card.collapsed .section-card-body{display:none;}

/* ── Table ── */
.rows-table{width:100%;border-collapse:collapse;}
.rows-table th{background:#f0f0f0;font-size:11px;font-weight:700;color:var(--text-soft);text-align:left;padding:8px 11px;border-bottom:1px solid var(--border-light);}
.rows-table td{padding:7px 11px;border-bottom:1px solid var(--border-light);vertical-align:middle;font-size:13px;}
.rows-table tr:last-child td{border-bottom:none;}
.rows-table tr:hover td{background:var(--accent-light);}
.rows-table input[type="text"]{width:100%;border:1px solid var(--border);border-radius:5px;padding:5px 7px;font-size:12px;font-family:inherit;color:var(--text);background:var(--surface2);}
.rows-table input:focus{outline:none;border-color:var(--accent);background:#fff;}
.col-no{width:34px;color:var(--text-soft);font-size:12px;text-align:center;}
.col-gubun{width:100px;}
.col-content{min-width:200px;}
.col-note{width:150px;}
.col-action{width:40px;text-align:center;}

/* ── Buttons ── */
.btn-add-row{display:flex;align-items:center;justify-content:center;gap:5px;margin:10px 16px;padding:7px;background:var(--accent-light);color:var(--accent);border:1px dashed var(--accent);border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;width:calc(100% - 32px);transition:all .15s;}
.btn-add-row:hover{background:var(--accent);color:#fff;}
.btn-del{background:none;border:none;color:#ccc;font-size:14px;cursor:pointer;padding:3px 6px;border-radius:4px;transition:all .15s;}
.btn-del:hover{color:var(--danger);background:var(--danger-light);}
.btn-add-section{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:11px;background:var(--surface);color:var(--accent);border:2px dashed var(--accent);border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:4px;transition:all .15s;}
.btn-add-section:hover{background:var(--accent-light);}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--accent);color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s;z-index:999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Modals ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:14px;padding:26px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-box h2{font-size:15px;font-weight:700;margin-bottom:8px;}
.modal-box p{font-size:13px;color:var(--text-mid);margin-bottom:20px;line-height:1.6;}
.modal-options{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.modal-opt{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:all .15s;font-size:13px;}
.modal-opt:hover{border-color:var(--accent);background:var(--accent-light);}
.modal-opt input[type="radio"]{accent-color:var(--accent);width:14px;height:14px;}
.modal-opt-label{font-weight:600;}
.modal-opt-desc{font-size:11px;color:var(--text-soft);}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.modal-cancel{background:none;border:1px solid var(--border);border-radius:7px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
.modal-cancel:hover{background:var(--bg);}
.modal-confirm{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.modal-confirm:hover{background:#3d6a4b;}
.modal-confirm-danger{background:var(--danger);}
.modal-confirm-danger:hover{background:#a03030;}

/* 탭 이름 편집 인풋 (모달 안) */
.modal-input{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--text);margin-bottom:18px;}
.modal-input:focus{outline:none;border-color:var(--accent);}

/* ── Print ── */
@media print{
  @page{size:A4;margin:13mm 10mm;}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body{background:#fff!important;font-size:10pt;}
  header{position:static!important;background:#4a7c59!important;height:auto!important;padding:8px 12px!important;margin-bottom:7px;box-shadow:none!important;}
  .header-btns{display:none!important;}
  .container{max-width:100%!important;padding:0!important;}
  .farm-info-bar{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:4px 12px!important;padding:8px 11px!important;margin-bottom:10px!important;box-shadow:none!important;border:1px solid #ccc!important;}
  .farm-info-item input{border:none!important;background:transparent!important;padding:0!important;font-weight:600;}
  .tab-bar-wrap,.btn-add-section,.btn-add-row,.col-action,.btn-section-del,#toast,.modal-overlay{display:none!important;}
  .section-panel{display:block!important;}
  .section-panel-print-title{display:block;font-size:11pt;font-weight:700;color:#4a7c59;border-bottom:2px solid #4a7c59;padding-bottom:3px;margin:12px 0 7px;}
  .section-card{box-shadow:none!important;border:1px solid #ccc!important;border-radius:3px!important;margin-bottom:7px!important;page-break-inside:avoid;}
  .section-card.collapsed .section-card-body{display:block!important;}
  .section-card-header{background:#e8f0eb!important;padding:5px 9px!important;}
  .collapse-icon{display:none!important;}
  .section-name-input{display:none!important;}
  .rows-table th{background:#f0f0f0!important;font-size:8pt!important;padding:3px 6px!important;}
  .rows-table td{padding:3px 6px!important;font-size:9pt!important;}
  .rows-table input[type="text"]{border:none!important;background:transparent!important;padding:0!important;font-size:9pt!important;}
  .section-number{background:#4a7c59!important;color:#fff!important;}
}
@media(max-width:768px){.container{padding:12px 8px;}.col-note{display:none;}}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-icon">🐔</span>
    <h1>강희농장 산란계 관리 프로그램<span>동물복지 평사</span></h1>
  </div>
  <div class="header-btns">
    <button class="hbtn hbtn-print" id="btnPrint">🖨️ 인쇄</button>
    <button class="hbtn hbtn-pdf"   id="btnPdf">📄 PDF</button>
    <button class="hbtn hbtn-load"  id="btnLoad">📂 불러오기</button>
    <button class="hbtn hbtn-save"  id="btnSave">💾 저장</button>
  </div>
</header>
<input type="file" id="fileInput" accept=".json" style="display:none">
<!-- PDF 모달 -->
<div class="modal-overlay" id="pdfModal">
  <div class="modal-box">
    <h2>📄 PDF 출력 옵션</h2>
    <p>출력할 범위를 선택하세요.<br>인쇄 창에서 "PDF로 저장"을 선택하면 PDF가 생성됩니다.</p>
    <div class="modal-options">
      <label class="modal-opt"><input type="radio" name="pdfRange" value="all" checked><div><div class="modal-opt-label">📋 전체 출력</div><div class="modal-opt-desc">모든 탭 내용을 한 번에</div></div></label>
      <label class="modal-opt"><input type="radio" name="pdfRange" value="current"><div><div class="modal-opt-label">📑 현재 탭만</div><div class="modal-opt-desc">지금 보고 있는 탭만</div></div></label>
    </div>
    <div class="modal-btns">
      <button class="modal-cancel" id="btnPdfCancel">취소</button>
      <button class="modal-confirm" id="btnPdfConfirm">인쇄 / PDF 저장</button>
    </div>
  </div>
</div>

<!-- 섹션 삭제 확인 -->
<div class="modal-overlay" id="delSecModal">
  <div class="modal-box">
    <h2>⚠️ 섹션 삭제</h2>
    <p id="delSecMsg">이 섹션을 삭제할까요?</p>
    <div class="modal-btns">
      <button class="modal-cancel" id="btnDelSecCancel">취소</button>
      <button class="modal-confirm modal-confirm-danger" id="btnDelSecConfirm">삭제</button>
    </div>
  </div>
</div>

<!-- 탭 삭제 확인 -->
<div class="modal-overlay" id="delTabModal">
  <div class="modal-box">
    <h2>⚠️ 탭 삭제</h2>
    <p id="delTabMsg">이 탭을 삭제할까요?</p>
    <div class="modal-btns">
      <button class="modal-cancel" id="btnDelTabCancel">취소</button>
      <button class="modal-confirm modal-confirm-danger" id="btnDelTabConfirm">삭제</button>
    </div>
  </div>
</div>

<!-- 탭 이름 편집 모달 -->
<div class="modal-overlay" id="tabNameModal">
  <div class="modal-box">
    <h2>✏️ 탭 이름 수정</h2>
    <input type="text" class="modal-input" id="tabNameInput" placeholder="탭 이름 입력">
    <div class="modal-btns">
      <button class="modal-cancel" id="btnTabNameCancel">취소</button>
      <button class="modal-confirm" id="btnTabNameConfirm">저장</button>
    </div>
  </div>
</div>

<div class="container">
  <!-- Farm Info -->
  <div class="farm-info-bar">
    <div class="farm-info-item"><label>농장명</label><input type="text" id="farmName" value="강희농장"></div>
    <div class="farm-info-item"><label>작성일</label><input type="date" id="writeDate"></div>
    <div class="farm-info-item"><label>작성자</label><input type="text" id="writer" placeholder="담당자명"></div>
    <div class="farm-info-item"><label>사육 규모</label><input type="text" id="scale" placeholder="예: 20,000수"></div>
    <div class="farm-info-item"><label>품종</label><input type="text" id="breed" placeholder="예: 하이라인브라운"></div>
    <div class="farm-info-item"><label>계사 동수</label><input type="text" id="houses" placeholder="예: 3동"></div>
  </div>

  <!-- Tab bar (동적 렌더) -->
  <div class="tab-bar-wrap" id="tabBarWrap">
    <div class="tabs" id="tabBar"></div>
    <button class="btn-add-tab" id="btnAddTab">＋ 탭 추가</button>
  </div>

  <!-- 패널 컨테이너 -->
  <div id="panelContainer"></div>
</div>

<div id="toast"></div>

<script>

/* ══════════════════════════════════════════
   상태
══════════════════════════════════════════ */
let tabList = [];          // [{id, label, sections}]
let currentTabId = '';
let nextTabNum = 8;        // 새 탭 ID 카운터
let pendingDelSecTab = null, pendingDelSecIdx = null;
let pendingDelTabId  = null;
let editingTabId     = null;
let printMode = 'current';

/* ══════════════════════════════════════════
   초기화
══════════════════════════════════════════ */
function init() {
  document.getElementById('writeDate').value = new Date().toISOString().split('T')[0];
  if (localStorage.getItem('ghfarm_version') !== DATA_VERSION) {
    localStorage.removeItem('ghfarm_data');
    localStorage.setItem('ghfarm_version', DATA_VERSION);
  }
  const saved = localStorage.getItem('ghfarm_data');
  if (saved) {
    try {
      const p = JSON.parse(saved);
      tabList  = p.tabList  || deepCopy(INIT_TABS);
      nextTabNum = p.nextTabNum || (tabList.length + 1);
      if (p.farm) {
        const m = {farmName:'name',writeDate:'date',writer:'writer',scale:'scale',breed:'breed',houses:'houses'};
        Object.entries(m).forEach(([elId, key]) => { if(p.farm[key]) document.getElementById(elId).value = p.farm[key]; });
      }
    } catch(e) { tabList = deepCopy(INIT_TABS); }
  } else {
    tabList = deepCopy(INIT_TABS);
  }
  currentTabId = tabList[0]?.id || '';
  renderAll();
  bindEvents();
}

function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

/* ══════════════════════════════════════════
   전체 렌더링
══════════════════════════════════════════ */
function renderAll() {
  renderTabBar();
  renderPanels();
}

/* ── 탭 바 렌더 ── */
function renderTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  tabList.forEach(tab => {
    const item = document.createElement('div');
    item.className = 'tab-item';

    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (tab.id === currentTabId ? ' active' : '');
    btn.dataset.tabId = tab.id;

    const nameSpan = document.createElement('span');
    nameSpan.className = 'tab-name-text';
    nameSpan.title = '더블클릭하여 이름 수정';
    nameSpan.textContent = tab.label;

    const badge = document.createElement('span');
    badge.className = 'tab-badge';
    badge.id = 'cnt_' + tab.id;
    badge.textContent = countTabRows(tab);

    btn.append(nameSpan, badge);

    // 탭 삭제 버튼
    const delBtn = document.createElement('button');
    delBtn.className = 'tab-del-btn';
    delBtn.title = '탭 삭제';
    delBtn.textContent = '×';
    delBtn.dataset.tabId = tab.id;

    item.append(btn, delBtn);
    bar.appendChild(item);
  });
}

/* ── 패널 렌더 ── */
function renderPanels() {
  const container = document.getElementById('panelContainer');
  container.innerHTML = '';
  tabList.forEach(tab => {
    const panel = document.createElement('div');
    panel.className = 'section-panel' + (tab.id === currentTabId ? ' active' : '');
    panel.id = 'panel_' + tab.id;

    // 인쇄용 제목
    const printTitle = document.createElement('div');
    printTitle.className = 'section-panel-print-title';
    printTitle.textContent = tab.label;
    panel.appendChild(printTitle);

    tab.sections.forEach((sec, sidx) => panel.appendChild(buildSectionCard(tab.id, sidx, sec)));

    // 섹션 추가 버튼
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-add-section';
    addBtn.dataset.tabId = tab.id;
    addBtn.textContent = '+ 항목 섹션 추가';
    panel.appendChild(addBtn);

    container.appendChild(panel);
  });
}

/* ── 섹션 카드 빌드 ── */
function buildSectionCard(tid, sidx, sec) {
  const card = document.createElement('div');
  card.className = 'section-card';

  // 헤더
  const hdr = document.createElement('div');
  hdr.className = 'section-card-header';

  const left = document.createElement('div');
  left.className = 'section-title-left';

  const numEl = document.createElement('div');
  numEl.className = 'section-number';
  numEl.textContent = sidx + 1;

  const nameWrap = document.createElement('div');
  nameWrap.className = 'section-name-wrap';

  const nameEl = document.createElement('span');
  nameEl.className = 'section-name';
  nameEl.title = '클릭하여 이름 수정';
  nameEl.textContent = sec.name;
  nameEl.dataset.tid  = tid;
  nameEl.dataset.sidx = sidx;

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'section-name-input';
  nameInput.value = sec.name;
  nameInput.dataset.tid  = tid;
  nameInput.dataset.sidx = sidx;

  const countEl = document.createElement('span');
  countEl.className = 'section-count';
  countEl.id = `sc_${tid}_${sidx}`;
  countEl.textContent = sec.rows.length > 0 ? `(${sec.rows.length}개)` : '';

  nameWrap.append(nameEl, nameInput, countEl);
  left.append(numEl, nameWrap);

  const rightBtns = document.createElement('div');
  rightBtns.className = 'section-header-btns';

  const delSecBtn = document.createElement('button');
  delSecBtn.className = 'btn-section-del';
  delSecBtn.title = '섹션 삭제';
  delSecBtn.textContent = '🗑';
  delSecBtn.dataset.tid  = tid;
  delSecBtn.dataset.sidx = sidx;

  const collapseIcon = document.createElement('span');
  collapseIcon.className = 'collapse-icon';
  collapseIcon.textContent = '▼';

  rightBtns.append(delSecBtn, collapseIcon);
  hdr.append(left, rightBtns);

  // 바디
  const body = document.createElement('div');
  body.className = 'section-card-body';

  const table = document.createElement('table');
  table.className = 'rows-table';
  table.innerHTML = `<thead><tr>
    <th class="col-no">#</th>
    <th class="col-gubun">구분</th>
    <th class="col-content">관리 내용</th>
    <th class="col-note">비고</th>
    <th class="col-action"></th>
  </tr></thead>`;

  const tbody = document.createElement('tbody');
  tbody.id = `tbody_${tid}_${sidx}`;
  sec.rows.forEach((r, ridx) => tbody.appendChild(buildRow(tid, sidx, ridx, r)));
  table.appendChild(tbody);

  const addRowBtn = document.createElement('button');
  addRowBtn.className = 'btn-add-row';
  addRowBtn.dataset.tid  = tid;
  addRowBtn.dataset.sidx = sidx;
  addRowBtn.textContent = '+ 항목 추가';

  body.append(table, addRowBtn);
  card.append(hdr, body);
  return card;
}

/* ── 행 빌드 ── */
function buildRow(tid, sidx, ridx, r) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="col-no">${ridx+1}</td>
    <td class="col-gubun"><input type="text" value="${esc(r.gubun)}"   data-tid="${tid}" data-sidx="${sidx}" data-ridx="${ridx}" data-field="gubun"></td>
    <td class="col-content"><input type="text" value="${esc(r.content)}" data-tid="${tid}" data-sidx="${sidx}" data-ridx="${ridx}" data-field="content"></td>
    <td class="col-note"><input type="text" value="${esc(r.note)}"    data-tid="${tid}" data-sidx="${sidx}" data-ridx="${ridx}" data-field="note"></td>
    <td class="col-action"><button class="btn-del" data-tid="${tid}" data-sidx="${sidx}" data-ridx="${ridx}">✕</button></td>`;
  return tr;
}

/* ══════════════════════════════════════════
   이벤트 바인딩
══════════════════════════════════════════ */
function bindEvents() {
  // 헤더 버튼
  document.getElementById('btnPrint').addEventListener('click', () => { printMode='current'; executePrint(); });
  document.getElementById('btnPdf').addEventListener('click',   () => document.getElementById('pdfModal').classList.add('show'));
  document.getElementById('btnLoad').addEventListener('click',  () => document.getElementById('fileInput').click());
  document.getElementById('btnSave').addEventListener('click',  saveAll);
  document.getElementById('fileInput').addEventListener('change', loadFile);

  // PDF 모달
  document.getElementById('btnPdfCancel').addEventListener('click',  () => document.getElementById('pdfModal').classList.remove('show'));
  document.getElementById('btnPdfConfirm').addEventListener('click', doPrint);

  // 섹션 삭제 모달
  document.getElementById('btnDelSecCancel').addEventListener('click',  () => document.getElementById('delSecModal').classList.remove('show'));
  document.getElementById('btnDelSecConfirm').addEventListener('click', confirmDelSection);

  // 탭 삭제 모달
  document.getElementById('btnDelTabCancel').addEventListener('click',  () => document.getElementById('delTabModal').classList.remove('show'));
  document.getElementById('btnDelTabConfirm').addEventListener('click', confirmDelTab);

  // 탭 이름 모달
  document.getElementById('btnTabNameCancel').addEventListener('click',  () => document.getElementById('tabNameModal').classList.remove('show'));
  document.getElementById('btnTabNameConfirm').addEventListener('click', confirmTabName);
  document.getElementById('tabNameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmTabName();
  });

  // 탭 추가
  document.getElementById('btnAddTab').addEventListener('click', addTab);

  // 위임 이벤트
  document.body.addEventListener('click', e => {
    // 탭 전환 (탭 버튼 클릭)
    const tabBtn = e.target.closest('.tab-btn');
    if (tabBtn && !e.target.classList.contains('tab-del-btn')) {
      switchTab(tabBtn.dataset.tabId); return;
    }
    // 탭 삭제
    const tabDelBtn = e.target.closest('.tab-del-btn');
    if (tabDelBtn) { openDelTabModal(tabDelBtn.dataset.tabId); return; }

    // 섹션 이름 클릭
    const sName = e.target.closest('.section-name');
    if (sName) { startEditSecName(sName); return; }

    // 섹션 접기
    const colIcon = e.target.closest('.collapse-icon');
    if (colIcon) { colIcon.closest('.section-card').classList.toggle('collapsed'); return; }

    // 섹션 삭제
    const delSecBtn = e.target.closest('.btn-section-del');
    if (delSecBtn) { openDelSecModal(delSecBtn.dataset.tid, parseInt(delSecBtn.dataset.sidx)); return; }

    // 섹션 추가
    const addSecBtn = e.target.closest('.btn-add-section');
    if (addSecBtn) { addSection(addSecBtn.dataset.tabId); return; }

    // 행 추가
    const addRowBtn = e.target.closest('.btn-add-row');
    if (addRowBtn) { addRow(addRowBtn.dataset.tid, parseInt(addRowBtn.dataset.sidx)); return; }

    // 행 삭제
    const delRowBtn = e.target.closest('.btn-del');
    if (delRowBtn) { delRow(delRowBtn.dataset.tid, parseInt(delRowBtn.dataset.sidx), parseInt(delRowBtn.dataset.ridx)); return; }
  });

  // 탭 이름 더블클릭
  document.body.addEventListener('dblclick', e => {
    const nameSpan = e.target.closest('.tab-name-text');
    if (nameSpan) {
      const btn = nameSpan.closest('.tab-btn');
      if (btn) openTabNameModal(btn.dataset.tabId);
    }
  });

  // 섹션 이름 input 키/blur
  document.body.addEventListener('keydown', e => {
    if (e.target.classList.contains('section-name-input')) {
      if (e.key === 'Enter')  e.target.blur();
      if (e.key === 'Escape') { e.target.dataset.cancel = '1'; e.target.blur(); }
    }
  });
  document.body.addEventListener('blur', e => {
    if (e.target.classList.contains('section-name-input')) finishEditSecName(e.target);
  }, true);

  // 행 input 변경
  document.body.addEventListener('change', e => {
    const el = e.target;
    if (!el.dataset.tid || el.dataset.sidx === undefined || el.dataset.ridx === undefined || !el.dataset.field) return;
    const tab = tabList.find(t => t.id === el.dataset.tid);
    const sec = tab?.sections[parseInt(el.dataset.sidx)];
    const row = sec?.rows[parseInt(el.dataset.ridx)];
    if (row) row[el.dataset.field] = el.value;
  });
}

/* ══════════════════════════════════════════
   탭 조작
══════════════════════════════════════════ */
function switchTab(tid) {
  currentTabId = tid;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tabId === tid));
  document.querySelectorAll('.section-panel').forEach(p => p.classList.toggle('active', p.id === 'panel_' + tid));
}

function addTab() {
  const id    = 'tab' + nextTabNum++;
  const label = '새 탭';
  tabList.push({id, label, sections:[]});
  renderAll();
  switchTab(id);
  openTabNameModal(id);
}

function openDelTabModal(tid) {
  if (tabList.length <= 1) { showToast('탭이 1개뿐이라 삭제할 수 없습니다.'); return; }
  pendingDelTabId = tid;
  const tab = tabList.find(t => t.id === tid);
  document.getElementById('delTabMsg').innerHTML =
    `<b>"${tab ? tab.label : ''}"</b> 탭을 삭제할까요?<br>포함된 모든 섹션과 항목이 삭제됩니다.`;
  document.getElementById('delTabModal').classList.add('show');
}

function confirmDelTab() {
  document.getElementById('delTabModal').classList.remove('show');
  if (!pendingDelTabId) return;
  const idx = tabList.findIndex(t => t.id === pendingDelTabId);
  tabList.splice(idx, 1);
  // 현재 탭이 삭제된 경우 앞 탭으로
  if (currentTabId === pendingDelTabId) {
    currentTabId = tabList[Math.max(0, idx-1)]?.id || tabList[0]?.id || '';
  }
  pendingDelTabId = null;
  renderAll();
  showToast('탭이 삭제되었습니다.');
}

function openTabNameModal(tid) {
  editingTabId = tid;
  const tab = tabList.find(t => t.id === tid);
  const inp = document.getElementById('tabNameInput');
  inp.value = tab ? tab.label : '';
  document.getElementById('tabNameModal').classList.add('show');
  setTimeout(() => inp.select(), 50);
}

function confirmTabName() {
  document.getElementById('tabNameModal').classList.remove('show');
  const val = document.getElementById('tabNameInput').value.trim();
  if (!val || !editingTabId) return;
  const tab = tabList.find(t => t.id === editingTabId);
  if (tab) tab.label = val;
  editingTabId = null;
  renderAll();
}

/* ══════════════════════════════════════════
   섹션 조작
══════════════════════════════════════════ */
function addSection(tid) {
  const tab = tabList.find(t => t.id === tid);
  if (!tab) return;
  tab.sections.push({name:'새 섹션', rows:[]});
  const sidx = tab.sections.length - 1;
  // 패널에 새 카드만 추가 (전체 재렌더 최소화)
  const panel = document.getElementById('panel_' + tid);
  const addSecBtn = panel.querySelector('.btn-add-section');
  const card = buildSectionCard(tid, sidx, tab.sections[sidx]);
  panel.insertBefore(card, addSecBtn);
  updateTabBadge(tid);
  // 이름 편집 시작
  const nameEl = card.querySelector('.section-name');
  if (nameEl) setTimeout(() => startEditSecName(nameEl), 50);
}

function openDelSecModal(tid, sidx) {
  pendingDelSecTab = tid;
  pendingDelSecIdx = sidx;
  const tab = tabList.find(t => t.id === tid);
  const sec = tab?.sections[sidx];
  document.getElementById('delSecMsg').innerHTML =
    `<b>"${sec ? sec.name : ''}"</b> 섹션을 삭제할까요?<br>포함된 모든 항목이 함께 삭제됩니다.`;
  document.getElementById('delSecModal').classList.add('show');
}

function confirmDelSection() {
  document.getElementById('delSecModal').classList.remove('show');
  if (pendingDelSecTab === null) return;
  const tab = tabList.find(t => t.id === pendingDelSecTab);
  if (tab) tab.sections.splice(pendingDelSecIdx, 1);
  pendingDelSecTab = pendingDelSecIdx = null;
  // 패널 재렌더
  const panel = document.getElementById('panel_' + tab.id);
  if (panel) {
    panel.innerHTML = '';
    const printTitle = document.createElement('div');
    printTitle.className = 'section-panel-print-title';
    printTitle.textContent = tab.label;
    panel.appendChild(printTitle);
    tab.sections.forEach((sec, si) => panel.appendChild(buildSectionCard(tab.id, si, sec)));
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-add-section';
    addBtn.dataset.tabId = tab.id;
    addBtn.textContent = '+ 항목 섹션 추가';
    panel.appendChild(addBtn);
  }
  updateTabBadge(tab.id);
  showToast('섹션이 삭제되었습니다.');
}

function startEditSecName(nameEl) {
  const wrap  = nameEl.closest('.section-name-wrap');
  const input = wrap.querySelector('.section-name-input');
  delete input.dataset.cancel;
  input.value = nameEl.textContent;
  nameEl.style.display = 'none';
  input.style.display  = 'inline-block';
  input.select();
}

function finishEditSecName(input) {
  const wrap   = input.closest('.section-name-wrap');
  const nameEl = wrap.querySelector('.section-name');
  if (!input.dataset.cancel) {
    const val = input.value.trim() || '(이름 없음)';
    const tab = tabList.find(t => t.id === input.dataset.tid);
    if (tab) tab.sections[parseInt(input.dataset.sidx)].name = val;
    nameEl.textContent = val;
  }
  input.style.display  = 'none';
  nameEl.style.display = '';
}

/* ══════════════════════════════════════════
   행 조작
══════════════════════════════════════════ */
function addRow(tid, sidx) {
  const tab = tabList.find(t => t.id === tid);
  if (!tab) return;
  tab.sections[sidx].rows.push({gubun:'',content:'',note:''});
  const rows  = tab.sections[sidx].rows;
  const ridx  = rows.length - 1;
  const tbody = document.getElementById(`tbody_${tid}_${sidx}`);
  tbody.appendChild(buildRow(tid, sidx, ridx, rows[ridx]));
  updateSecCount(tid, sidx);
  updateTabBadge(tid);
  const inputs = tbody.querySelectorAll('tr:last-child input');
  if (inputs[0]) inputs[0].focus();
}

function delRow(tid, sidx, ridx) {
  const tab = tabList.find(t => t.id === tid);
  if (!tab) return;
  tab.sections[sidx].rows.splice(ridx, 1);
  const tbody = document.getElementById(`tbody_${tid}_${sidx}`);
  tbody.innerHTML = '';
  tab.sections[sidx].rows.forEach((r, i) => tbody.appendChild(buildRow(tid, sidx, i, r)));
  updateSecCount(tid, sidx);
  updateTabBadge(tid);
}

/* ══════════════════════════════════════════
   카운트 업데이트
══════════════════════════════════════════ */
function countTabRows(tab) {
  return tab.sections.reduce((s, sec) => s + sec.rows.length, 0);
}

function updateSecCount(tid, sidx) {
  const el = document.getElementById(`sc_${tid}_${sidx}`);
  if (!el) return;
  const tab = tabList.find(t => t.id === tid);
  const cnt = tab?.sections[sidx]?.rows.length || 0;
  el.textContent = cnt > 0 ? `(${cnt}개)` : '';
}

function updateTabBadge(tid) {
  const el = document.getElementById('cnt_' + tid);
  if (!el) return;
  const tab = tabList.find(t => t.id === tid);
  el.textContent = tab ? countTabRows(tab) : 0;
}

/* ══════════════════════════════════════════
   불러오기
══════════════════════════════════════════ */
function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const p = JSON.parse(ev.target.result);
      if (!p.tabList) { showToast('❌ 올바른 저장 파일이 아닙니다.'); return; }

      tabList    = p.tabList;
      nextTabNum = p.nextTabNum || (tabList.length + 1);
      currentTabId = tabList[0]?.id || '';

      if (p.farm) {
        const m = {farmName:'name',writeDate:'date',writer:'writer',scale:'scale',breed:'breed',houses:'houses'};
        Object.entries(m).forEach(([elId, key]) => {
          if (p.farm[key]) document.getElementById(elId).value = p.farm[key];
        });
      }

      // localStorage에도 반영
      localStorage.setItem('ghfarm_data', JSON.stringify(p));
      localStorage.setItem('ghfarm_version', DATA_VERSION);

      renderAll();
      showToast(`"${file.name}" 불러오기 완료!`);
    } catch(err) {
      showToast('❌ 파일을 읽는 중 오류가 발생했습니다.');
    }
    // input 초기화 (같은 파일 재선택 가능)
    e.target.value = '';
  };
  reader.readAsText(file);
}

/* ══════════════════════════════════════════
   저장
══════════════════════════════════════════ */
function getFarmInfo() {
  return {
    name:   document.getElementById('farmName').value,
    date:   document.getElementById('writeDate').value,
    writer: document.getElementById('writer').value,
    scale:  document.getElementById('scale').value,
    breed:  document.getElementById('breed').value,
    houses: document.getElementById('houses').value,
  };
}

function saveAll() {
  const payload = {farm: getFarmInfo(), tabList, nextTabNum, savedAt: new Date().toISOString()};
  localStorage.setItem('ghfarm_data', JSON.stringify(payload));
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `강희농장_관리프로그램_${getFarmInfo().date||'export'}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('저장 완료! JSON 파일이 다운로드됩니다.');
}

/* ══════════════════════════════════════════
   인쇄 / PDF
══════════════════════════════════════════ */
function doPrint() {
  document.getElementById('pdfModal').classList.remove('show');
  const r = document.querySelector('input[name="pdfRange"]:checked');
  printMode = r ? r.value : 'all';
  setTimeout(executePrint, 200);
}

function executePrint() {
  const allPanels = document.querySelectorAll('.section-panel');
  const allCards  = document.querySelectorAll('.section-card');
  allPanels.forEach(p => p.dataset.pw = p.classList.contains('active') ? '1':'0');
  allCards.forEach(c  => c.dataset.pw = c.classList.contains('collapsed') ? '1':'0');
  allCards.forEach(c => c.classList.remove('collapsed'));
  if (printMode === 'all') allPanels.forEach(p => p.classList.add('active'));
  window.print();
  setTimeout(() => {
    allPanels.forEach(p => { if(p.dataset.pw!=='1') p.classList.remove('active'); });
    allCards.forEach(c  => { if(c.dataset.pw==='1') c.classList.add('collapsed'); });
  }, 800);
}

/* ══════════════════════════════════════════
   유틸
══════════════════════════════════════════ */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = '✅ ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

/* ══════════════════════════════════════════
   시작
══════════════════════════════════════════ */
init();
</script>
